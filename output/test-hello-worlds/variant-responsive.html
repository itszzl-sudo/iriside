<!DOCTYPE html>
<html>
<head>
<title>Hello World - Responsive</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0f0c29;
  font-family: sans-serif;
}
h1 {
  color: white;
  text-align: center;
}
@media (max-width: 480px) {
  h1 { font-size: 2rem; }
}
@media (min-width: 481px) and (max-width: 768px) {
  h1 { font-size: 3rem; }
}
@media (min-width: 769px) and (max-width: 1024px) {
  h1 { font-size: 4rem; }
}
@media (min-width: 1025px) {
  h1 { font-size: 6rem; }
}
</style>
</head>
<body>
<h1>Hello World</h1>
</body>
</html>
