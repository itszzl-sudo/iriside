<!DOCTYPE html>
<html>
<head>
<title>Hello World - Neon</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0a0a0a;
  font-family: sans-serif;
}
h1 {
  font-size: 5rem;
  color: #fff;
  text-shadow:
    0 0 7px #fff,
    0 0 10px #fff,
    0 0 21px #fff,
    0 0 42px #bc13fe,
    0 0 82px #bc13fe,
    0 0 92px #bc13fe,
    0 0 102px #bc13fe,
    0 0 151px #bc13fe;
  animation: pulsate 0.5s ease-in-out infinite alternate;
}
@keyframes pulsate {
  100% {
    text-shadow:
      0 0 4px #fff,
      0 0 11px #fff,
      0 0 19px #fff,
      0 0 40px #bc13fe,
      0 0 80px #bc13fe,
      0 0 90px #bc13fe,
      0 0 100px #bc13fe,
      0 0 150px #bc13fe;
  }
  0% {
    text-shadow:
      0 0 4px #fff,
      0 0 10px #fff,
      0 0 18px #fff,
      0 0 38px #bc13fe,
      0 0 73px #bc13fe,
      0 0 80px #bc13fe,
      0 0 94px #bc13fe,
      0 0 140px #bc13fe;
  }
}
</style>
</head>
<body>
<h1>Hello World</h1>
</body>
</html>
