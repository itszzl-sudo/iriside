<!DOCTYPE html>
<html>
<head>
<title>Hello World App</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  font-family: sans-serif;
}
.app {
  background: white;
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
h1 {
  margin: 0 0 20px;
  color: #333;
}
input {
  padding: 10px 20px;
  border: 2px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
  margin-bottom: 10px;
}
button {
  padding: 10px 30px;
  background: #667eea;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  transition: background 0.3s;
}
button:hover {
  background: #764ba2;
}
#result {
  margin-top: 20px;
  font-size: 18px;
  color: #666;
}
</style>
</head>
<body>
<div class="app">
  <h1>Hello World</h1>
  <input type="text" id="nameInput" placeholder="输入你的名字">
  <button onclick="greet()">问候</button>
  <div id="result"></div>
</div>
<script>
function greet() {
  const name = document.getElementById('nameInput').value || 'World';
  document.getElementById('result').textContent = 'Hello, ' + name + '!';
}
</script>
</body>
</html>
