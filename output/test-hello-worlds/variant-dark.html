<!DOCTYPE html>
<html>
<head>
<title>Hello World - Dark</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0d0d0d;
  font-family: 'Courier New', monospace;
}
h1 {
  font-size: 5rem;
  color: #00ff00;
  text-shadow: 
    0 0 10px #00ff00,
    0 0 20px #00ff00,
    0 0 40px #00ff00,
    0 0 80px #00ff00;
  animation: flicker 1.5s infinite alternate;
}
@keyframes flicker {
  0% { opacity: 0.8; }
  100% { opacity: 1; }
}
</style>
</head>
<body>
<h1>Hello World</h1>
</body>
</html>
