<!DOCTYPE html>
<html>
<head>
<title>Hello World - Interactive</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #2d2d30;
  font-family: sans-serif;
}
#hello {
  font-size: 4rem;
  color: white;
  cursor: pointer;
  user-select: none;
  transition: all 0.3s ease;
  padding: 20px;
  border-radius: 10px;
}
#hello:hover {
  transform: scale(1.1);
  background: rgba(255,255,255,0.1);
}
#hello:active {
  transform: scale(0.95);
}
</style>
</head>
<body>
<h1 id="hello" onclick="changeColor()" ondblclick="explode()">Hello World</h1>
<script>
const colors = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe'];
let colorIndex = 0;
function changeColor() {
  colorIndex = (colorIndex + 1) % colors.length;
  document.getElementById('hello').style.color = colors[colorIndex];
}
function explode() {
  const h1 = document.getElementById('hello');
  h1.style.transform = 'scale(2) rotate(360deg)';
  setTimeout(() => h1.style.transform = 'scale(1)', 500);
}
</script>
</body>
</html>
